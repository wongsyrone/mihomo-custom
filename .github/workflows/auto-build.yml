name: Build Custom Mihomo

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream mihomo tag (empty = latest release)'
        required: false
        type: string
      force:
        description: 'Force rebuild and overwrite release if it already exists'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'overlay/**'
      - 'tools/patcher/**'
      - '.github/workflows/auto-build.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-build-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Resolve target upstream tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve upstream release tag" >&2
            exit 1
          fi

          EXISTS=false
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS=true
          fi

          SHOULD_BUILD=false
          SHOULD_RELEASE=false
          if [ "$EXISTS" = "false" ] || [ "$INPUT_FORCE" = "true" ]; then
            SHOULD_BUILD=true
            SHOULD_RELEASE=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            SHOULD_BUILD=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG exists=$EXISTS should_build=$SHOULD_BUILD should_release=$SHOULD_RELEASE"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Test semantic patcher
        run: |
          set -euo pipefail
          (cd tools/patcher && go test -v ./...)

      - name: Clone upstream mihomo and locked sing-tun
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p upstream
          git clone --depth 1 --branch "$TAG" https://github.com/MetaCubeX/mihomo.git upstream/mihomo
          SING_TUN_VER=$(awk '/github\.com\/metacubex\/sing-tun[[:space:]]/{print $2; exit}' upstream/mihomo/go.mod)
          if [ -z "$SING_TUN_VER" ]; then
            echo "Could not find sing-tun version in upstream/mihomo/go.mod" >&2
            exit 1
          fi
          echo "SING_TUN_VER=$SING_TUN_VER" >> "$GITHUB_ENV"
          if ! git clone --depth 1 --branch "$SING_TUN_VER" https://github.com/MetaCubeX/sing-tun.git upstream/sing-tun; then
            COMMIT=$(echo "$SING_TUN_VER" | awk -F- '{print $NF}')
            git clone https://github.com/MetaCubeX/sing-tun.git upstream/sing-tun
            git -C upstream/sing-tun checkout "$COMMIT"
          fi

      - name: Apply overlays and semantic AST patches
        id: patch
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          (cd tools/patcher && go run . -sing-tun "$GITHUB_WORKSPACE/upstream/sing-tun" -mihomo "$GITHUB_WORKSPACE/upstream/mihomo" -overlay "$GITHUB_WORKSPACE/overlay")
          (cd upstream/mihomo && go mod edit -replace github.com/metacubex/sing-tun=../sing-tun)
          mkdir -p dist
          git -C upstream/sing-tun diff > dist/sing-tun-semantic.diff
          git -C upstream/mihomo diff > dist/mihomo-semantic.diff

      - name: Report semantic patch failure issue
        if: failure() && steps.patch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SING_TUN_VER: ${{ env.SING_TUN_VER }}
        run: |
          set -euo pipefail
          TITLE="Semantic patcher failure on upstream ${TAG}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf "Automated Overlay + Go AST semantic patching failed for upstream **%s** (sing-tun %s).\n\nWorkflow run: %s/actions/runs/%s\n" \
            "$TAG" "${SING_TUN_VER:-unknown}" "${{ github.server_url }}" "${{ github.run_id }}")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Run unit tests and cross-platform compile checks
        run: |
          set -euo pipefail
          (
            cd upstream/sing-tun
            go test -v -run 'TestSelectDefaultInterface|TestRouteTable|TestRouteInterface' .
            GOOS=windows GOARCH=amd64 go test -c -o /dev/null .
            GOOS=linux GOARCH=amd64 go test -c -o /dev/null .
            GOOS=darwin GOARCH=arm64 go test -c -o /dev/null .
          )
          (
            cd upstream/mihomo
            go test -v ./transport/anytls/session ./listener/sing_tun
            go test -v -run 'TestTunDefaultInterfacePriorityCompat' ./config
            go test -v -run 'TestPoolReset' ./component/pool ./transport/snell
            go test -v -run 'TestClientResetSessions|TestReuseManagerAndClientResetSessions|TestPoolClientResetSessions' ./transport/gun ./transport/xhttp ./transport/mekya ./transport/tuic
            go test -v -run 'TestAutoCloseAndSingMuxResetSessions|TestWireGuardResetSessionsCallsBindUpdate|TestOutboundResetSessionsNilSafe' ./adapter/outbound
            GOOS=windows GOARCH=amd64 go build -tags with_gvisor ./listener/sing_tun ./config ./listener/config ./adapter/outbound ./component/pool ./transport/anytls/session ./transport/gun ./transport/xhttp ./transport/mekya ./transport/tuic ./transport/tuic/v4 ./transport/tuic/v5 ./transport/hysteria/core ./transport/shadowquic ./transport/trusttunnel ./transport/snell ./transport/kcptun ./transport/sudoku ./transport/masque
            for pkg in ./listener/sing_tun ./config ./adapter/outbound ./component/pool ./transport/anytls/session ./transport/gun ./transport/xhttp ./transport/mekya ./transport/tuic ./transport/snell; do
              GOOS=windows GOARCH=amd64 go test -tags with_gvisor -c -o /dev/null "$pkg"
            done
          )

      - name: Refresh embedded CA certificates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt upstream/mihomo/component/ca/ca-certificates.crt

      - name: Build release binaries (Windows, Linux, macOS)
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILDTIME=$(date -u)
          LDFLAGS="-X \"github.com/metacubex/mihomo/constant.Version=${TAG}-custom\" -X \"github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}\" -w -s -buildid="

          (
            cd upstream/mihomo
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v3 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-windows-amd64.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-windows-amd64-compatible.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-windows-arm64.exe"

            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v3 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-linux-amd64"
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-linux-arm64"

            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 GOAMD64=v3 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-darwin-amd64"
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/dist/mihomo-darwin-arm64"
          )

          (
            cd dist
            zip -9 "mihomo-windows-amd64-${TAG}.zip" mihomo-windows-amd64.exe
            zip -9 "mihomo-windows-amd64-compatible-${TAG}.zip" mihomo-windows-amd64-compatible.exe
            zip -9 "mihomo-windows-arm64-${TAG}.zip" mihomo-windows-arm64.exe
            rm -f mihomo-windows-amd64.exe mihomo-windows-amd64-compatible.exe mihomo-windows-arm64.exe

            gzip -9 -c mihomo-linux-amd64 > "mihomo-linux-amd64-${TAG}.gz"
            gzip -9 -c mihomo-linux-arm64 > "mihomo-linux-arm64-${TAG}.gz"
            gzip -9 -c mihomo-darwin-amd64 > "mihomo-darwin-amd64-${TAG}.gz"
            gzip -9 -c mihomo-darwin-arm64 > "mihomo-darwin-arm64-${TAG}.gz"
            rm -f mihomo-linux-amd64 mihomo-linux-arm64 mihomo-darwin-amd64 mihomo-darwin-arm64

            sha256sum *.zip *.gz > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-custom-${{ needs.check.outputs.tag }}
          path: dist/

      - name: Publish GitHub Release
        if: needs.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SING_TUN_VER: ${{ env.SING_TUN_VER }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$INPUT_FORCE" = "true" ] && gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" -y
          fi
          NOTES=$(printf "Custom Mihomo build tracking upstream **%s** (sing-tun **%s**) via Package Overlays + Go AST Semantic Patcher.\n\nRelease binaries:\n- Windows: \`amd64\` (v3), \`amd64-compatible\` (v1), \`arm64\` (\`.zip\`)\n- Linux: \`amd64\` (v3), \`arm64\` (\`.gz\`)\n- macOS: \`amd64\` (v3), \`arm64\` (\`.gz\`)\n\nApplied semantic features:\n- \`sing-tun\` overlay + AST patch: declarative \`tun.default-interface-priority\` order + metric tie-break stickiness and OS non-default route table lookup (\`RouteInterface\`) on Windows, Linux (\`netlink\`), and macOS (\`AF_ROUTE\`)\n- \`mihomo\` TUN overlay + AST patch: \`tun.default-interface-priority\` config wiring, route-aware \`cDialerInterfaceFinder\`, \`autoCloseProxyAdapter\` unwrapping, and bounded stale connection reset preserving healthy pinned/routed interfaces on default interface switch\n- \`mihomo\` Outbound overlay + AST patch: non-destructive \`ResetSessions()\` across \`anytls\`, \`singmux\`, \`gun\`/\`xhttp\`/\`mekya\`, \`hysteria2\`/\`hysteria\`/\`tuic\`/\`shadowquic\`/\`trusttunnel\`, \`ssh\`/\`snell\`/\`kcptun\`/\`sudoku\`/\`mieru\`, \`masque\`/\`openvpn\`/\`wireguard\`\n" "$TAG" "$SING_TUN_VER")
          gh release create "$TAG" dist/*.zip dist/*.gz dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "$NOTES"
